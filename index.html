<!DOCTYPE html>
<html>
	<head>
		<title>Homepage</title>
		<link rel='stylesheet' href='styles.css' />
		<style>
			html {
				margin: 0;
				padding: 0;
				width: 100%;
				background-color: #d7d5c1;
			}
			
			body {
				margin: auto;
				margin-top: 2%;
				padding: 0;
				width: 75%;
				background-color: #e5e2d1;
				height: 1600px;
			}
			
			nav {
				padding: 0;
				padding-top: 16px;
				padding-left: 4px;
				padding-right: 4px;
				background-color: #eeeffe;
				width: 8em;
				height: 100%;
				float: left;
			}
			
			nav ul {
				list-style-type: none;
				padding: 0;
				margin: 0;
				position: sticky;
				top: 2em;
			}
			
			nav ul li {
				display:block;
				position:relative;
				list-style: none;
				border: 1px solid #aaa;
				border-top: 0px;
				width: 7em;
				height: 2.5em;
				vertical-align: middle;
				line-height: 2.5em;
				padding-left: 1em;
				color: #333;
				background-color: #eeeffe;
				font-family: Tahoma, sans-serif;
				z-index: 2;
			}
			
			nav ul li::after {
				content: '';
				position:absolute;
				display:inline-block;
				top: 0;
				left: 0;
				width:0%;
				height:100%;
				background-color: #dddeed;
				border-left: none;
				transition: width .25s ease-in-out;
				z-index: -1;
			}
			
			nav ul li:hover::after {
				position:absolute;
				top: 0;
				left: 0;
				height:100%;
				border-left: 5px solid #cccddc;
				background-color: #dddeed;
				width:100%;
			}
			
			nav ul li::before {
				content: '';
				display:inline-block;
				position:absolute;
				left: 0;
				width: 100%;
				height: .125em;
				background-color: #005eee;
			}
			
			#current {
				background-color: #cccddc;
			}
			#current:hover {
				background-color: #cccddc;
			}
			#current::after {
				border-left: 5px solid #bbbccb;
			}
			#current:hover::after {
				border-left: 5px solid #bbbccb;
				width: 0%;
			}
			
			@keyframes bgslide {
				from: {}
				to: {linear-gradient(90deg, #dddeed 100%, #eeeffe 0%);}
			}
			
			@keyframes slide {
				from: {width:0%;}
				to: {width:100%;}
			}
			
			#prof {
				width: 7em;
				height: 7em;
				margin: .5em;
				
			}
			#name {
				text-align: center;
				margin:0;
				margin-bottom: .5em;
			}
			
		</style>
	</head>
	<body>
		<nav>
			<div>
				<svg viewbox='0 0 100 100' id='prof'>
					<circle cx=50 cy=50 r=50 fill='black'/>
				</svg>
				<h2 id='name'>ABCDE ABCDEFG</h2>
			</div>
			<ul>
				<li id='current'>Home</li>
				<li>About</li>
				<li>Projects</li>
				<li>CV</li>
			<ul>
		</nav>
		<header>
			<h1>Home</h1>
		</header>
		<article>
		
		</article>
	</body>
</html>
